name: Generate Daily Questions with AI

on:
  schedule:
    # 毎日日本時間 深夜0:00 (UTC 15:00) に自動実行
    - cron: '0 15 * * *'
  # GitHubの画面から手動でポチッと実行も可能
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run generation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add questions.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update questions by Gemini AI" && git push)