<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wikinator</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      padding: 8px 0;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.025em;
    }

    header p {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    /* ローディング画面 */
    #loading-view {
      text-align: center;
      padding: 40px 20px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 入力エリア */
    .input-form {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      font-size: 1rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button {
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-outline {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.875rem;
      padding: 8px 16px;
    }

    .btn-outline:hover:not(:disabled) {
      background-color: #f1f5f9;
      color: var(--text);
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    /* 結果通知エリア */
    #status-card {
      display: none;
      text-align: center;
      animation: fadeIn 0.3s ease;
    }

    #status-card.win {
      border-color: var(--success);
      background-color: var(--success-bg);
      color: var(--text);
    }

    #status-card.lose {
      border-color: var(--danger);
      background-color: var(--danger-bg);
      color: var(--text);
    }

    #status-card h2 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    #status-card a {
      color: var(--primary);
      font-weight: bold;
      word-break: break-all;
    }

    .action-buttons {
      margin-top: 16px;
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    /* 質問履歴リスト */
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .history-header h3 {
      font-size: 1rem;
      font-weight: 700;
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 0.95rem;
      animation: fadeIn 0.2s ease;
    }

    .history-item.hit {
      background: #ecfdf5;
      border-color: #a7f3d0;
      color: #065f46;
      font-weight: 600;
    }

    .history-item.miss {
      color: #64748b;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .badge-hit {
      background-color: #10b981;
      color: #ffffff;
    }

    .badge-miss {
      background-color: #cbd5e1;
      color: #475569;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>WikiGuesser</h1>
    <p>隠されたWikipedia記事のタイトルを推測しよう！</p>
  </header>

  <!-- ローディング中 -->
  <div id="loading-view" class="card">
    <div class="spinner"></div>
    <p id="loading-msg">良質な記事を探しています...</p>
  </div>

  <!-- ゲーム終了時のカード（正解 / ギブアップ） -->
  <div id="status-card" class="card">
    <h2 id="status-title"></h2>
    <p id="status-desc" style="margin-bottom: 8px;"></p>
    <p id="status-link-wrap">
      記事リンク: <a id="status-link" href="" target="_blank" rel="noopener noreferrer"></a>
    </p>
    <div class="action-buttons">
      <button class="btn-primary" onclick="initGame()">もう一度遊ぶ</button>
    </div>
  </div>

  <!-- メインゲームエリア -->
  <main id="game-view" class="card" style="display: none;">
    <form class="input-form" id="guess-form" onsubmit="handleGuess(event)">
      <input 
        type="text" 
        id="word-input" 
        placeholder="単語を入力（例: 日本、歴史、科学...）" 
        autocomplete="off"
        required
      >
      <button type="submit" class="btn-primary" id="submit-btn">質問する</button>
    </form>

    <div class="stats-bar">
      <span>試行回数: <strong id="guess-count">0</strong> 回</span>
      <button type="button" class="btn-outline" onclick="giveUp()" id="giveup-btn">ギブアップ</button>
    </div>
  </main>

  <!-- 履歴表示 -->
  <section id="history-view" class="card" style="display: none;">
    <div class="history-header">
      <h3>質問の履歴</h3>
      <span id="hit-rate" style="font-size: 0.8rem; color: var(--text-muted);"></span>
    </div>
    <ul class="history-list" id="history-list"></ul>
  </section>
</div>

<script>
  // ゲームの状態
  let currentArticle = {
    title: '',
    cleanTitle: '', // 曖昧さ回避括弧を除去したタイトル
    extract: '',
    normalizedTitle: '',
    normalizedCleanTitle: '',
    normalizedExtract: '',
    url: ''
  };

  let attempts = [];
  let isGameOver = false;

  // テキストの正規化（NFKC正規化 + 小文字化）
  function normalizeText(str) {
    if (!str) return '';
    return str.normalize('NFKC').toLowerCase().trim();
  }

  // 正規表現エスケープ
  function escapeRegExp(string) {
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  // 1500文字以上の良質な記事を取得する
  async function fetchQualityArticle() {
    const MIN_LENGTH = 1500;
    
    while (true) {
      try {
        // generator=randomで一度に複数件取得して効率化
        const endpoint = `https://ja.wikipedia.org/w/api.php?action=query&generator=random&grnnamespace=0&grnlimit=5&prop=extracts&explaintext=1&exintro=0&origin=*&format=json`;
        const res = await fetch(endpoint);
        const data = await res.json();

        if (data && data.query && data.query.pages) {
          const pages = Object.values(data.query.pages);
          for (const page of pages) {
            const text = page.extract || '';
            const title = page.title || '';

            // 曖昧さ回避ページや短すぎる記事をスキップ
            if (
              text.length >= MIN_LENGTH &&
              !title.includes('曖昧さ回避') &&
              !text.includes('曖昧さ回避のためのページ')
            ) {
              const cleanTitle = title.replace(/\s*\(.*?\)$/, ''); // 末尾の (曖昧さ回避) 等を除去
              return {
                title: title,
                cleanTitle: cleanTitle,
                extract: text,
                normalizedTitle: normalizeText(title),
                normalizedCleanTitle: normalizeText(cleanTitle),
                normalizedExtract: normalizeText(text),
                url: `https://ja.wikipedia.org/wiki/${encodeURIComponent(title)}`
              };
            }
          }
        }
      } catch (err) {
        console.error('記事の取得に失敗しました。再試行します...', err);
      }
      // 再試行のウェイト
      await new Promise(r => setTimeout(r, 600));
    }
  }

  // ゲームの初期化
  async function initGame() {
    isGameOver = false;
    attempts = [];

    // UI初期化
    document.getElementById('loading-view').style.display = 'block';
    document.getElementById('game-view').style.display = 'none';
    document.getElementById('history-view').style.display = 'none';
    document.getElementById('status-card').style.display = 'none';
    document.getElementById('status-card').className = 'card';
    document.getElementById('history-list').innerHTML = '';
    document.getElementById('guess-count').textContent = '0';
    document.getElementById('hit-rate').textContent = '';
    document.getElementById('word-input').value = '';
    document.getElementById('word-input').disabled = false;
    document.getElementById('submit-btn').disabled = false;
    document.getElementById('giveup-btn').disabled = false;

    // 記事取得
    currentArticle = await fetchQualityArticle();

    // ゲーム画面表示
    document.getElementById('loading-view').style.display = 'none';
    document.getElementById('game-view').style.display = 'block';
    document.getElementById('history-view').style.display = 'block';
    document.getElementById('word-input').focus();
  }

  // 質問・推測の処理
  function handleGuess(e) {
    e.preventDefault();
    if (isGameOver) return;

    const inputElem = document.getElementById('word-input');
    const rawInput = inputElem.value.trim();
    const normalizedInput = normalizeText(rawInput);

    if (normalizedInput.length < 2) {
      alert('2文字以上で入力してください。');
      return;
    }

    // 重複入力チェック
    if (attempts.some(a => a.normalized === normalizedInput)) {
      alert('その単語はすでに質問しています。');
      inputElem.value = '';
      return;
    }

    // 正解判定（タイトル完全一致、または括弧除去後のタイトル一致）
    const isCorrect = (
      normalizedInput === currentArticle.normalizedTitle ||
      normalizedInput === currentArticle.normalizedCleanTitle
    );

    // 出現回数のカウント
    const regex = new RegExp(escapeRegExp(normalizedInput), 'g');
    const matches = currentArticle.normalizedExtract.match(regex);
    const count = matches ? matches.length : 0;

    const attempt = {
      word: rawInput,
      normalized: normalizedInput,
      count: count,
      hit: count > 0,
      isCorrect: isCorrect
    };

    attempts.unshift(attempt); // 最新を先頭に追加
    updateHistoryUI();
    inputElem.value = '';

    if (isCorrect) {
      gameClear();
    } else {
      inputElem.focus();
    }
  }

  // 履歴UIの更新
  function updateHistoryUI() {
    const listElem = document.getElementById('history-list');
    document.getElementById('guess-count').textContent = attempts.length;

    const hits = attempts.filter(a => a.hit).length;
    document.getElementById('hit-rate').textContent = `ヒット率: ${Math.round((hits / attempts.length) * 100) || 0}%`;

    listElem.innerHTML = attempts.map(item => `
      <li class="history-item ${item.hit ? 'hit' : 'miss'}">
        <span><strong>${escapeHtml(item.word)}</strong></span>
        <span class="badge ${item.hit ? 'badge-hit' : 'badge-miss'}">
          ${item.hit ? `はい（${item.count}回）` : 'いいえ（0回）'}
        </span>
      </li>
    `).join('');
  }

  // HTMLエスケープ
  function escapeHtml(str) {
    return str.replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
  }

  // ゲームクリア
  function gameClear() {
    isGameOver = true;
    finishGameControls();

    const statusCard = document.getElementById('status-card');
    statusCard.className = 'card win';
    document.getElementById('status-title').textContent = '🎉 正解です！お見事！';
    document.getElementById('status-desc').textContent = `正解は「${currentArticle.title}」でした！（試行回数: ${attempts.length}回）`;
    
    const link = document.getElementById('status-link');
    link.href = currentArticle.url;
    link.textContent = currentArticle.title;

    statusCard.style.display = 'block';
  }

  // ギブアップ
  function giveUp() {
    if (isGameOver) return;
    if (!confirm('本当にギブアップしますか？答えが表示されます。')) return;

    isGameOver = true;
    finishGameControls();

    const statusCard = document.getElementById('status-card');
    statusCard.className = 'card lose';
    document.getElementById('status-title').textContent = '🏳️ ギブアップ！';
    document.getElementById('status-desc').textContent = `答えは「${currentArticle.title}」でした。`;

    const link = document.getElementById('status-link');
    link.href = currentArticle.url;
    link.textContent = currentArticle.title;

    statusCard.style.display = 'block';
  }

  // コントロール無効化
  function finishGameControls() {
    document.getElementById('word-input').disabled = true;
    document.getElementById('submit-btn').disabled = true;
    document.getElementById('giveup-btn').disabled = true;
  }

  // ゲーム開始
  window.addEventListener('DOMContentLoaded', initGame);
</script>
</body>
</html>
