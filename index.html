<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wikinator (ウィキネイター) - Wikipedia推測ゲーム</title>
  
  <!-- ファビコン・Webクリップアイコン -->
  <link rel="icon" type="image/png" href="wikinator_icon.png">
  <link rel="shortcut icon" type="image/png" href="wikinator_icon.png">
  <link rel="apple-touch-icon" href="wikinator_icon.png">

  <!-- OGP設定（X / Twitter / SNSプレビュー用） -->
  <meta property="og:url" content="https://t-sukuea-latatalas.github.io/Wikinator/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Wikinator (ウィキネイター) - Wikipedia推測ゲーム" />
  <meta property="og:description" content="隠されたWikipedia記事のタイトルを、単語を質問しながら推測して当てるアキネーター型ゲーム！" />
  <meta property="og:image" content="https://t-sukuea-latatalas.github.io/Wikinator/wikinator_icon.png" />
  <meta property="og:site_name" content="Wikinator" />

  <!-- X (Twitter) Card設定 -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Wikinator (ウィキネイター) - Wikipedia推測ゲーム" />
  <meta name="twitter:description" content="隠されたWikipedia記事のタイトルを、単語を質問しながら推測して当てるアキネーター型ゲーム！" />
  <meta name="twitter:image" content="https://t-sukuea-latatalas.github.io/Wikinator/wikinator_icon.png" />

  <!-- 外部スタイルシート -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="confetti-canvas"></canvas>
  <div id="toast" class="toast"></div>

  <header id="mw-header">
    <a href="#" onclick="location.reload()" class="wiki-logo">
      <img src="wikinator_icon.png" alt="W" class="wiki-logo-icon">
      <div class="wiki-logo-text"><strong>Wikinator</strong><span>ウィキネイター</span></div>
    </a>
    <div class="header-actions">
      <button class="icon-btn" id="mute-btn" onclick="toggleMute()" title="ミュート切替">
        <svg class="svg-icon" id="vol-icon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
      </button>
    </div>
  </header>

  <main id="content">
    <div id="setup-view">
      <div class="ambox ambox-notice">
        <div style="padding-top:2px;">
          <svg class="svg-icon" style="width:24px; height:24px;" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        </div>
        <div style="width: 100%;">
          <strong class="ambox-title">Wikinator 設定</strong>
          <p style="margin-bottom:12px;">Wikipediaの黒塗りされた記事を推測して開示しながら「タイトル」を当てるゲームです。</p>
          
          <div class="mode-box">
            <label style="font-weight:bold; display:block; margin-bottom:10px;">ゲームモード:</label>
            
            <!-- 1. テーマ・難易度別リスト選択モード (デフォルト) -->
            <label style="display:block; margin-bottom:12px; cursor:pointer; font-size:1.05rem;">
              <input type="radio" name="game-mode" value="list" checked onchange="toggleMode()">
              <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
              【おすすめ】リスト選択モード
            </label>

            <!-- 2. デイリー問題モード -->
            <label style="display:block; margin-bottom:12px; cursor:pointer; font-size:1.05rem;">
              <input type="radio" name="game-mode" value="daily" onchange="toggleMode()">
              <svg class="svg-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
              【日替わり】デイリー問題
            </label>

            <!-- 3. 完全ランダムモード -->
            <label style="display:block; cursor:pointer; font-size:1.05rem;">
              <input type="radio" name="game-mode" value="random" onchange="toggleMode()">
              <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
              【地獄】完全ランダム
            </label>
          </div>

          <!-- リスト選択ドロップダウン -->
          <div id="list-select-wrapper" style="margin-bottom:15px; display:block;">
            <label style="font-weight:bold; display:block; margin-bottom:6px;">プレイするリストを選択:</label>
            <select id="list-select" class="mw-ui-input" style="max-width:350px;">
              <optgroup label="難易度別">
                <option value="easy" selected>初級</option>
                <option value="normal">中級</option>
                <option value="hard">上級</option>
                <option value="pr">不可能</option>
              </optgroup>
              <optgroup label="ジャンル別">
                <option value="history">歴史・事件・人物</option>
                <option value="science">科学・自然・宇宙</option>
                <option value="geo">地理・国・名所</option>
                <option value="anime">アニメ・マンガ・ゲーム</option>
                <option value="culture">文化・芸術・文学</option>
              </optgroup>
            </select>
          </div>

          <!-- デイリー問題: 出題日選択 -->
          <div id="daily-wrapper" style="margin-bottom:15px; display:none;">
            <label style="font-weight:bold; display:block; margin-bottom:6px;">出題日を選択 (過去問アーカイブ):</label>
            <input type="date" id="daily-date-picker" class="mw-ui-input" style="max-width:260px;">
          </div>

          <div style="margin-top:20px;">
            <button type="button" class="mw-ui-button progressive" onclick="startGame()" style="width:100%; max-width:350px; padding:12px; font-size:1.1rem;">ゲームを開始</button>
          </div>
        </div>
      </div>
      <div id="setup-ranking-wrapper"></div>
    </div>

    <div id="loading-view" style="display:none;">
      <div class="spinner"></div>
      <p id="loading-msg" style="font-size:1.1rem; font-weight:bold;">データを取得中...</p>
      <p id="loading-submsg" style="font-size:0.9rem; margin-top:8px;">(少し時間がかかる場合があります)</p>
    </div>

    <div id="game-view" style="display:none;">
      <div id="result-ambox" class="ambox" style="display: none; flex-direction: column;">
        <div style="display: flex; gap: 15px; align-items:flex-start;">
          <div id="result-icon" style="padding-top:2px;"></div>
          <div style="flex: 1;">
            <strong class="ambox-title" id="result-title" style="font-size:1.2rem;">正解です！</strong>
            <div id="result-score-box" style="margin: 8px 0; font-size: 1.1rem; background:#f0f8ff; padding:10px; border-radius:4px; border:1px solid #cce0ff;">
              <div>
                <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                タイム: <strong id="result-time" style="color:var(--text);"></strong>
              </div>
              <div style="margin-top:4px;">
                <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>
                得点: <strong id="result-score" style="color:#d32f2f; font-size:1.2rem;"></strong> 点
              </div>
            </div>
            <p id="result-desc"></p>
          </div>
        </div>
      </div>

      <div id="result-ranking-wrapper"></div>
      <h1 class="firstHeading" id="article-heading">【 ■ ■ ■ 】</h1>
      <div id="article-length"></div>
      <div id="article-preview" class="article-preview"></div>
    </div>
  </main>

  <!-- ランキングDOM -->
  <div id="ranking-section" class="ambox ambox-notice" style="flex-direction:column; margin-top: 15px;">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
      <strong class="ambox-title" style="margin:0;">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.45 1-1 1H8v4h8v-4h-1c-.55 0-1-.45-1-1v-2.34"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"></path></svg>
        オンラインランキング (Top 10)
      </strong>
      <div class="ranking-tabs">
        <button id="tab-weekly" class="mw-ui-button progressive" onclick="switchRankingTab('weekly')">
          <svg class="svg-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          週間
        </button>
        <button id="tab-all" class="mw-ui-button" onclick="switchRankingTab('all')">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.45 1-1 1H8v4h8v-4h-1c-.55 0-1-.45-1-1v-2.34"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"></path></svg>
          全期間
        </button>
      </div>
    </div>
    <div id="ranking-form" style="display:none; gap:8px; margin:12px 0;">
      <input type="text" id="player-name" class="mw-ui-input" placeholder="ニックネーム" maxlength="12" style="max-width:200px;">
      <button class="mw-ui-button progressive" onclick="submitScoreBtn()">スコアを登録</button>
    </div>
    <table id="leaderboard-table" style="width:100%; border-collapse: collapse; font-size:0.92rem; margin-top:10px;">
      <thead>
        <tr>
          <th style="width:40px;">順位</th>
          <th>名前</th>
          <th>得点</th>
          <th>タイム</th>
          <th>解いた記事</th>
          <th style="width:60px;">リンク</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
        <tr><td colspan="6">読み込み中...（API未設定時は表示されません）</td></tr>
      </tbody>
    </table>
  </div>

  <!-- 下部固定パネル -->
  <div id="bottom-panel" style="display:none;">
    <div class="bottom-panel-inner">
      
      <!-- 永続ハイライト用 前後ジャンプナビ -->
      <div id="jump-nav-box">
        <span id="nav-info-text" style="font-weight:bold; color:var(--link);"></span>
        <div style="display:flex; gap:6px; align-items:center;">
          <button type="button" class="mw-ui-button" onclick="prevNav()" style="padding:4px 8px;">
            <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg> 前へ
          </button>
          <button type="button" class="mw-ui-button" onclick="nextNav()" style="padding:4px 8px;">
            次へ <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
          <button type="button" class="mw-ui-button" onclick="closeNav()" style="padding:4px 8px;">
            <svg class="svg-icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
      </div>

      <!-- 開示されたヒント（常時固定表示エリア） -->
      <div id="docked-hints-container">
        <strong>開示ヒント:</strong>
        <div id="docked-hints-list" style="margin-top:2px;"></div>
      </div>

      <!-- クリア/ギブアップ後の常時固定アクションボタン -->
      <div id="docked-result-actions">
        <button class="mw-ui-button progressive" onclick="location.reload()">次の記事へ</button>
        <a id="docked-share-x-btn" href="#" target="_blank" class="mw-ui-button" style="text-decoration:none; background:#0f1419; color:#fff; border-color:#0f1419;">
          <svg class="svg-icon svg-icon-fill" viewBox="0 0 24 24" style="fill:#fff;"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg> ポスト
        </a>
        <a id="docked-result-link" href="#" target="_blank" class="mw-ui-button" style="text-decoration:none;">
          Wikipedia <svg class="svg-icon" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </a>
      </div>

      <div class="panel-header">
        <div style="font-size:0.88rem;">試行: <strong id="guess-count">0</strong>回 <span id="hit-rate-pc" style="color:var(--text-muted); margin-left:4px;"></span></div>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
          <button class="mw-ui-button" id="helper-particle-btn" onclick="openParticles()" style="padding:4px 8px; font-size:0.8rem;" title="助詞・助動詞をすべて開示 (-1000点)">
            <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
            付属語OPEN
          </button>
          <button class="mw-ui-button" id="helper-number-btn" onclick="openNumbers()" style="padding:4px 8px; font-size:0.8rem;" title="数字（アラビア・漢数字）をすべて開示 (-500点)">
            <svg class="svg-icon" viewBox="0 0 24 24"><line x1="4" y1="9" x2="20" y2="9"></line><line x1="4" y1="15" x2="20" y2="15"></line><line x1="10" y1="3" x2="8" y2="21"></line><line x1="16" y1="3" x2="14" y2="21"></line></svg>
            数字OPEN
          </button>
          <button class="mw-ui-button" id="hint-btn" onclick="useHint()" style="padding:4px 8px; font-size:0.8rem;">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M12 2a7 7 0 0 0-7 7c0 2.4 1.2 4.5 3 5.7V17h8v-2.3c1.8-1.2 3-3.3 3-5.7a7 7 0 0 0-7-7z"></path></svg>
            ヒント(3)
          </button>
          <button class="mw-ui-button" id="giveup-btn" onclick="giveUp()" style="padding:4px 8px; font-size:0.8rem; color:var(--ambox-red);">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>
            ギブアップ
          </button>
        </div>
      </div>

      <form id="guess-form" onsubmit="handleGuess(event)" style="display:flex; gap:8px;">
        <input type="text" class="mw-ui-input" id="word-input" placeholder="単語を入力..." required autocomplete="off">
        <button type="submit" class="mw-ui-button progressive" id="submit-btn" style="min-width:70px;">送信</button>
      </form>
      
      <div class="bottom-history-container">
        <div style="display:flex; justify-content:space-between; padding:4px 8px; background:#eaecf0; font-size:0.82rem; font-weight:bold; position:sticky; top:0; z-index:1;">
          <span>質問履歴 (新着順) <span style="font-weight:normal; color:var(--text-muted);">※クリックで該当箇所ジャンプ</span></span>
        </div>
        <ul class="toc-list" id="history-list"></ul>
      </div>
    </div>
  </div>

  <!-- 分割スクリプト読み込み -->
  <script type="module" src="js/firebase.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
