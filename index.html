<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>推測ゲーム - ウィキペディア (Redactle風・全文版)</title>
  <style>
    :root {
      --wiki-bg: #f6f6f6;
      --content-bg: #ffffff;
      --text: #202122;
      --text-muted: #54595d;
      --border: #a2a9b1;
      --border-light: #eaecf0;
      --link: #0645ad;
      --ooui-blue: #36c;
      --ooui-blue-hover: #447ff5;
      --ambox-yellow: #fc3;
      --ambox-green: #00af89;
      --ambox-red: #d33;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--wiki-bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif;
      font-size: 14px;
      line-height: 1.6;
      padding: 0 1em 2em;
    }

    #mw-header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 0 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .wiki-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
    }
    .wiki-logo-icon {
      width: 32px; height: 32px; background: #000; color: #fff;
      font-family: serif; font-size: 24px; font-weight: bold;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
    }
    .wiki-logo-text strong { font-family: serif; font-size: 1.15rem; display: block; }
    .wiki-logo-text span { font-size: 0.75rem; color: var(--text-muted); }

    .header-actions { display: flex; align-items: center; gap: 15px; }
    .icon-btn {
      background: none; border: none; font-size: 1.4rem; cursor: pointer;
      opacity: 0.8; transition: opacity 0.2s;
    }
    .icon-btn:hover { opacity: 1; }

    #content {
      max-width: 1100px; margin: 0 auto;
      background: var(--content-bg); border: 1px solid var(--border);
      padding: 1.5em; position: relative;
    }

    .ambox {
      border: 1px solid var(--border-light); border-left: 10px solid var(--border);
      padding: 12px; margin-bottom: 1.2em; display: flex; gap: 12px; font-size: 0.9rem;
    }
    .ambox-notice { border-left-color: var(--ooui-blue); background-color: #f8f9fa; }
    .ambox-success { border-left-color: var(--ambox-green); background-color: #f3fbf8; }
    .ambox-danger { border-left-color: var(--ambox-red); background-color: #fdf5f5; }
    .ambox-title { font-weight: bold; display: block; margin-bottom: 4px; font-size: 1rem; }

    .mw-ui-input {
      font-family: inherit; font-size: 0.95rem; border: 1px solid var(--border);
      border-radius: 2px; padding: 7px 10px; outline: none; width: 100%; max-width: 100%;
    }
    .mw-ui-input:focus { border-color: var(--ooui-blue); box-shadow: inset 0 0 0 1px var(--ooui-blue); }

    .mw-ui-button {
      font-size: 0.9rem; font-weight: bold; border-radius: 2px; padding: 7px 14px;
      cursor: pointer; border: 1px solid var(--border); background-color: #f8f9fa; color: var(--text);
    }
    .mw-ui-button:hover:not(:disabled) { background-color: #fff; border-color: #72777d; }
    .mw-ui-button.progressive { background-color: var(--ooui-blue); border-color: var(--ooui-blue); color: #fff; }
    .mw-ui-button.progressive:hover:not(:disabled) { background-color: var(--ooui-blue-hover); }
    .mw-ui-button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* メイン2カラムレイアウト */
    .main-grid {
      display: flex; gap: 20px; align-items: flex-start; margin-top: 15px;
    }
    .left-panel {
      flex: 0 0 340px;
      position: sticky; top: 15px;
    }
    .right-panel {
      flex: 1; min-width: 0;
    }

    /* パネル系 */
    .game-panel {
      background: #f8f9fa; border: 1px solid var(--border-light);
      padding: 12px; margin-bottom: 1em; border-radius: 2px;
    }
    .stats-row {
      display: flex; justify-content: space-between; font-size: 0.85rem; margin-top: 10px; flex-wrap: wrap; gap: 8px;
    }

    .toc-box {
      border: 1px solid var(--border); background: #f8f9fa; padding: 10px; border-radius: 2px;
    }
    .toc-title { display: flex; justify-content: space-between; font-weight: bold; font-size: 0.9rem; margin-bottom: 8px; align-items: center;}
    .toc-list { list-style: none; max-height: 400px; overflow-y: auto; padding-right: 5px; }
    .toc-item { padding: 6px; font-size: 0.95rem; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; cursor: pointer;}
    .toc-item:hover { background: #fff; }
    .toc-item.miss .toc-word { color: var(--text-muted); }

    /* ヒートマップバッジ */
    .toc-badge { font-size: 0.8rem; padding: 2px 8px; border-radius: 12px; font-weight: bold; min-width: 45px; text-align: center; }
    .badge-miss { background: #eaecf0; color: #72777d; }
    .badge-low { background: #e6f6ee; color: #007a50; border: 1px solid #bce8d2; }
    .badge-mid { background: #bce8d2; color: #005a30; border: 1px solid #00af89; }
    .badge-high { background: #fc3; color: #523b00; border: 1px solid #d4a700; }

    /* 記事プレビューエリア */
    .firstHeading {
      font-family: serif; font-size: 1.85rem; border-bottom: 1px solid var(--border);
      padding-bottom: 4px; margin-bottom: 15px;
    }
    .article-preview {
      font-size: 1.05rem; line-height: 1.8; white-space: pre-wrap; padding-bottom: 40px;
      word-wrap: break-word; overflow-wrap: break-word;
    }
    
    /* 黒塗り・ハイライト装飾 */
    .masked-block {
      background-color: #202122; color: transparent; border-radius: 2px; margin: 0 1px; user-select: none;
    }
    .revealed { color: var(--text); }
    .revealed-latest {
      background-color: #eaf3ff; color: #0645ad; font-weight: bold; border-radius: 2px;
      animation: highlightFade 2s ease-out;
    }
    @keyframes highlightFade {
      0% { background-color: #ffe299; }
      100% { background-color: #eaf3ff; }
    }

    /* その他UIコンポーネント */
    #loading-view { text-align: center; padding: 40px; color: var(--text-muted); }
    .spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid var(--border-light); border-top-color: var(--ooui-blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 10px;}
    @keyframes spin { to { transform: rotate(360deg); } }

    #confetti-canvas {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 9999; display: none;
    }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 4px;
      z-index: 10000; opacity: 0; transition: opacity 0.3s; pointer-events: none; font-weight: bold;
    }
    .mode-box {
      margin-bottom: 15px; padding: 10px; background: #fff; border: 1px solid var(--border-light); border-radius: 2px;
    }

    @media (max-width: 768px) {
      .main-grid { flex-direction: column; }
      .left-panel { position: static; width: 100%; }
      .article-preview { font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>
  <div id="toast" class="toast"></div>

  <header id="mw-header">
    <a href="#" onclick="location.reload()" class="wiki-logo">
      <div class="wiki-logo-icon">W</div>
      <div class="wiki-logo-text"><strong>WIKIPEDIA</strong><span>推測ゲーム</span></div>
    </a>
    <div class="header-actions">
      <button class="icon-btn" id="mute-btn" onclick="toggleMute()" title="ミュート切替">🔊</button>
    </div>
  </header>

  <main id="content">
    <!-- セットアップ画面 -->
    <div id="setup-view">
      <div class="ambox ambox-notice">
        <div style="font-size:1.5rem;">📚</div>
        <div style="width: 100%;">
          <strong class="ambox-title">ゲーム設定 (全文版)</strong>
          <p style="margin-bottom:10px;">Wikipediaの記事本文が黒塗りされています。単語を推測して送信し、徐々にアンマスクされる文脈から「記事のタイトル」を当ててください。</p>
          
          <!-- モード選択 -->
          <div class="mode-box">
            <label style="font-weight:bold; display:block; margin-bottom:8px;">ゲームモードを選択:</label>
            <label style="display:block; margin-bottom:6px; cursor:pointer;">
              <input type="radio" name="game-mode" value="quality" checked onchange="toggleMode()">
              🌟 良質な記事モード (おすすめ・知名度高め)
            </label>
            <label style="display:block; cursor:pointer;">
              <input type="radio" name="game-mode" value="random" onchange="toggleMode()">
              🎲 完全ランダムモード (ハード・激ムズ)
            </label>
          </div>

          <div id="category-wrapper" style="margin-bottom:15px; transition: opacity 0.2s;">
            <label style="font-weight:bold; margin-right:8px;">カテゴリ (良質モード用):</label>
            <select id="category-select" class="mw-ui-input" style="width:200px; display:inline-block;">
              <option value="all">すべて (良質な記事)</option>
              <option value="history">歴史・事件</option>
              <option value="science">科学・自然・宇宙</option>
              <option value="geo">地理・国・都市</option>
              <option value="culture">人物・文化・芸術</option>
            </select>
          </div>
          
          <div>
            <button type="button" class="mw-ui-button progressive" onclick="startGame()">ゲームを開始</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ロード画面 -->
    <div id="loading-view" style="display:none;">
      <div class="spinner"></div>
      <p id="loading-msg">Wikipediaから記事全文を取得しています...</p>
      <p id="loading-submsg" style="font-size:0.8rem; color:#777;">(データ量が多いため数秒かかる場合があります)</p>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-view" style="display:none;">
      
      <!-- 結果表示 (ambox) -->
      <div id="result-ambox" class="ambox" style="display: none; flex-direction: column;">
        <div style="display: flex; gap: 12px; align-items:flex-start;">
          <div id="result-icon" style="font-size:1.8rem;">🎉</div>
          <div style="flex: 1;">
            <strong class="ambox-title" id="result-title">正解です！</strong>
            <p id="result-desc"></p>
            <div style="margin-top: 10px; display:flex; gap:10px;">
              <button class="mw-ui-button progressive" onclick="location.reload()">次の記事で遊ぶ</button>
              <button class="mw-ui-button" onclick="shareResult()">📋 結果をシェア</button>
              <a id="result-link" href="#" target="_blank" class="mw-ui-button" style="text-decoration:none;">Wikipediaで読む ↗</a>
            </div>
          </div>
        </div>
      </div>

      <div class="main-grid">
        <!-- 左カラム: 操作パネル -->
        <div class="left-panel">
          <div class="game-panel">
            <form id="guess-form" onsubmit="handleGuess(event)" style="display:flex; gap:8px;">
              <input type="text" class="mw-ui-input" id="word-input" placeholder="単語を入力..." required autocomplete="off">
              <button type="submit" class="mw-ui-button progressive" id="submit-btn">送信</button>
            </form>
            <div class="stats-row">
              <span>試行: <strong id="guess-count">0</strong>回 <span id="hit-rate"></span></span>
              <button type="button" class="mw-ui-button" id="hint-btn" onclick="useHint()" style="padding:4px 8px; font-size:0.8rem;">💡 ヒント(3)</button>
            </div>
          </div>

          <div class="toc-box">
            <div class="toc-title">
              <span>質問履歴</span>
              <select id="sort-select" class="mw-ui-input" style="width: auto; padding: 2px 6px; font-size:0.8rem;" onchange="renderHistory()">
                <option value="new">新着順</option>
                <option value="count">出現回数順</option>
              </select>
            </div>
            <ul class="toc-list" id="history-list"></ul>
            <div style="margin-top:10px; text-align:right;">
              <button class="mw-ui-button" id="giveup-btn" onclick="giveUp()" style="font-size:0.8rem; color:var(--ambox-red);">🏳️ ギブアップ</button>
            </div>
          </div>
        </div>

        <!-- 右カラム: 記事プレビュー -->
        <div class="right-panel">
          <h1 class="firstHeading" id="article-heading">【 ■ ■ ■ 】</h1>
          <div id="article-preview" class="article-preview"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // --- 1. グローバル変数 & 状態 ---
    const MAX_HINTS = 3;
    let currentArticle = null;
    let attempts = [];
    let hintsUsed = 0;
    let isGameOver = false;
    let currentTurn = 0;
    
    // 黒塗り管理 (文字ごとの解禁ターン記録, 0=未解禁)
    let charRevealed; 

    // オーディオ設定
    let audioCtx = null;
    let isMuted = false;

    // --- モード切替のUI制御 ---
    function toggleMode() {
      const isRandom = document.querySelector('input[name="game-mode"]:checked').value === 'random';
      const catSelect = document.getElementById('category-select');
      const catWrapper = document.getElementById('category-wrapper');
      catSelect.disabled = isRandom;
      catWrapper.style.opacity = isRandom ? '0.4' : '1';
    }

    // --- 2. Web Audio API 音声生成 ---
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function toggleMute() {
      isMuted = !isMuted;
      document.getElementById('mute-btn').textContent = isMuted ? '🔇' : '🔊';
    }
    function playTone(freq, type, duration, vol) {
      if (isMuted || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }
    function playClick() { playTone(600, 'sine', 0.05, 0.1); }
    function playHit(count) { playTone(400 + Math.min(count, 25) * 20, 'triangle', 0.25, 0.2); }
    function playMiss() { playTone(120, 'sawtooth', 0.2, 0.15); }
    function playClear() {
      setTimeout(() => playTone(523.25, 'square', 0.3, 0.15), 0);
      setTimeout(() => playTone(659.25, 'square', 0.3, 0.15), 100);
      setTimeout(() => playTone(783.99, 'square', 0.3, 0.15), 200);
      setTimeout(() => playTone(1046.50, 'square', 0.6, 0.15), 300);
    }
    function playGiveup() {
      setTimeout(() => playTone(349.23, 'triangle', 0.3, 0.2), 0);
      setTimeout(() => playTone(329.63, 'triangle', 0.3, 0.2), 200);
      setTimeout(() => playTone(293.66, 'triangle', 0.6, 0.2), 400);
    }

    // --- 3. テキスト正規化 (カタカナ・全角を統一) ---
    function normalizeChar(char) {
      let c = char.toLowerCase();
      if (/[Ａ-Ｚａ-ｚ０-９]/.test(c)) c = String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
      if (/[ァ-ン]/.test(c)) c = String.fromCharCode(c.charCodeAt(0) - 0x60);
      return c;
    }
    function normalizeText(str) {
      let res = '';
      for(let i=0; i<str.length; i++) res += normalizeChar(str[i]);
      return res;
    }
    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
    }

    // --- 4. Wikipedia API 取得 (全文取得 & モード分岐) ---
    async function fetchArticle(mode, categoryType) {
      // ▼ 完全ランダムモード
      if (mode === 'random') {
        for (let attempt = 0; attempt < 10; attempt++) {
          try {
            // 一度に10件取得して走査する
            const endpoint = `https://ja.wikipedia.org/w/api.php?action=query&generator=random&grnnamespace=0&grnlimit=10&prop=extracts&explaintext=1&origin=*&format=json`;
            const res = await fetch(endpoint);
            const data = await res.json();
            
            if (data && data.query && data.query.pages) {
              let pages = Object.values(data.query.pages).sort(() => Math.random() - 0.5);
              for (const p of pages) {
                // 500文字未満のスタブ、曖昧さ回避、一覧記事を弾く
                if (!p.extract || p.extract.length < 500 || p.title.includes('曖昧さ回避') || p.title.includes('一覧')) continue;
                
                const clean = p.title.replace(/\s*\(.*?\)$/, '');
                return {
                  title: p.title,
                  cleanTitle: clean,
                  extract: p.extract,
                  normalizedExtract: normalizeText(p.extract),
                  normalizedCleanTitle: normalizeText(clean),
                  url: `https://ja.wikipedia.org/wiki/${encodeURIComponent(p.title)}`,
                  modeName: '🎲 完全ランダム'
                };
              }
            }
          } catch(e) { console.error(e); }
        }
        // 万が一見つからなかった場合は良質な記事にフォールバック
        return fetchArticle('quality', 'all');
      } 
      // ▼ 良質な記事モード (通常)
      else {
        const cats = {
          'all': ['Category:良質な記事'],
          'history': ['歴史', '時代', '事件', '戦争', '史'],
          'science': ['科学', '物理', '化学', '生物', '宇宙', '自然', '医学', '工学'],
          'geo': ['地理', '国', '都市', '地形', '交通', '地域', '山'],
          'culture': ['人物', '文化', '芸術', '音楽', '美術', '宗教', '文学']
        };
        const targets = cats[categoryType];
        const chars = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわABCDEFGHIJKLMNOPQRSTUVWXYZ';

        for (let attempt = 0; attempt < 10; attempt++) {
          try {
            const randChar = chars[Math.floor(Math.random() * chars.length)];
            const endpoint = `https://ja.wikipedia.org/w/api.php?action=query&generator=categorymembers&gcmtitle=Category:良質な記事&gcmnamespace=0&gcmlimit=50&gcmstartsortkeyprefix=${encodeURIComponent(randChar)}&prop=extracts|categories&explaintext=1&cllimit=max&origin=*&format=json`;
            
            const res = await fetch(endpoint);
            const data = await res.json();
            
            if (data && data.query && data.query.pages) {
              let pages = Object.values(data.query.pages).sort(() => Math.random() - 0.5);
              for (const p of pages) {
                if (!p.extract || p.extract.length < 500 || p.title.includes('曖昧さ回避')) continue;
                
                let match = (categoryType === 'all');
                if (!match && p.categories) {
                  const catStr = p.categories.map(c => c.title).join(' ');
                  match = targets.some(kw => catStr.includes(kw));
                }
                
                if (match) {
                  const clean = p.title.replace(/\s*\(.*?\)$/, '');
                  const sel = document.getElementById('category-select');
                  const catName = sel.options[sel.selectedIndex].text;
                  return {
                    title: p.title,
                    cleanTitle: clean,
                    extract: p.extract,
                    normalizedExtract: normalizeText(p.extract),
                    normalizedCleanTitle: normalizeText(clean),
                    url: `https://ja.wikipedia.org/wiki/${encodeURIComponent(p.title)}`,
                    modeName: `🌟 良質な記事 (${catName})`
                  };
                }
              }
            }
          } catch(e) { console.error(e); }
        }
        return fetchArticle('quality', 'all');
      }
    }

    async function startGame() {
      initAudio();
      const mode = document.querySelector('input[name="game-mode"]:checked').value;
      const cat = document.getElementById('category-select').value;
      
      // ローディングメッセージの動的変更
      if (mode === 'random') {
        document.getElementById('loading-msg').textContent = '完全ランダム記事を探しています...';
        document.getElementById('loading-submsg').textContent = '(※非常にマニアックなお題が出る場合があります)';
      } else {
        document.getElementById('loading-msg').textContent = 'Wikipediaから記事全文を取得しています...';
        document.getElementById('loading-submsg').textContent = '(データ量が多いため数秒かかる場合があります)';
      }

      document.getElementById('setup-view').style.display = 'none';
      document.getElementById('loading-view').style.display = 'block';

      currentArticle = await fetchArticle(mode, cat);
      // 記事全文の文字数に合わせて動的にマスク配列を確保
      charRevealed = new Uint16Array(currentArticle.extract.length);
      
      document.getElementById('loading-view').style.display = 'none';
      document.getElementById('game-view').style.display = 'block';
      document.getElementById('word-input').focus();
      
      updateArticlePreview(0);
    }

    // --- 5. ゲームロジック ---
    function handleGuess(e) {
      e.preventDefault();
      if (isGameOver) return;
      initAudio();

      const inputElem = document.getElementById('word-input');
      const rawWord = inputElem.value.trim();
      const normWord = normalizeText(rawWord);
      
      if (normWord.length < 1) return;

      // 1文字ゴリ押し防止バリデーション (サロゲートペア等も考慮)
      const charArray = Array.from(rawWord);
      if (charArray.length === 1) {
        // 漢字（Hanスクリプト）または「々」以外は弾く
        if (!/^[\p{Script=Han}々]$/u.test(rawWord)) {
          showToast('ひらがな・カタカナ・英数字は2文字以上で入力してください');
          inputElem.value = '';
          inputElem.focus();
          return;
        }
      }

      if (attempts.some(a => a.norm === normWord)) {
        showToast('すでに質問済みです');
        inputElem.value = '';
        return;
      }

      currentTurn++;
      let count = 0;
      
      // indexOf を使用した高速検索アルゴリズム
      const text = currentArticle.normalizedExtract;
      const len = normWord.length;
      let startIndex = 0;

      while ((startIndex = text.indexOf(normWord, startIndex)) !== -1) {
        count++;
        // ヒットした文字のインデックスを現在のターン数でマーキング
        for (let j = 0; j < len; j++) {
          charRevealed[startIndex + j] = currentTurn;
        }
        startIndex += 1;
      }

      const isCorrect = (normWord === currentArticle.normalizedCleanTitle || rawWord === currentArticle.title);
      attempts.unshift({ word: rawWord, norm: normWord, count, hit: count > 0, turn: currentTurn, isCorrect });
      
      inputElem.value = '';
      
      if (count > 0) playHit(count); else playMiss();
      
      updateUI();
      updateArticlePreview(currentTurn);

      if (isCorrect) endGame(true);
    }

    function useHint() {
      if (isGameOver || hintsUsed >= MAX_HINTS) return;
      hintsUsed++;
      playClick();
      
      const hints = [
        `タイトルは ${currentArticle.cleanTitle.length} 文字です。`,
        `タイトルの最初の文字は「 ${currentArticle.cleanTitle[0]} 」です。`,
        `タイトルの最後の文字は「 ${currentArticle.cleanTitle[currentArticle.cleanTitle.length-1]} 」です。`
      ];
      
      showToast(`ヒント ${hintsUsed}/3: ${hints[hintsUsed-1]}`);
      document.getElementById('hint-btn').textContent = `💡 ヒント(${MAX_HINTS - hintsUsed})`;
      if (hintsUsed >= MAX_HINTS) document.getElementById('hint-btn').disabled = true;
    }

    // --- 6. UI & 描画更新 ---
    function updateUI() {
      document.getElementById('guess-count').textContent = attempts.length;
      const hits = attempts.filter(a => a.hit).length;
      document.getElementById('hit-rate').textContent = `(ヒット率: ${Math.round((hits/attempts.length)*100)}%)`;
      renderHistory();
      
      const latestItem = attempts[0];
      const badge = document.getElementById(`badge-${latestItem.turn}`);
      if (badge) animateValue(badge, 0, latestItem.count, 400);
    }

    function renderHistory() {
      const sort = document.getElementById('sort-select').value;
      let list = [...attempts];
      if (sort === 'count') list.sort((a, b) => b.count - a.count || b.turn - a.turn);
      
      const html = list.map(item => {
        let bClass = 'badge-miss';
        if (item.count > 0 && item.count < 5) bClass = 'badge-low';
        else if (item.count >= 5 && item.count < 20) bClass = 'badge-mid';
        else if (item.count >= 20) bClass = 'badge-high';
        
        return `<li class="toc-item ${item.hit?'hit':'miss'}" onclick="scrollToLatest()">
          <span class="toc-word">${escapeHtml(item.word)}</span>
          <span class="toc-badge ${bClass}" id="badge-${item.turn}">${item.count}回</span>
        </li>`;
      }).join('');
      document.getElementById('history-list').innerHTML = html;
    }

    function updateArticlePreview(latestTurn) {
      const html = [];
      const text = currentArticle.extract;
      
      const maskRegex = /[\p{L}\p{N}々〆]/u;
      let addedLatestId = false;

      for (let i = 0; i < text.length; i++) {
        if (text[i] === '\n') { html.push('\n'); continue; }
        
        if (maskRegex.test(text[i]) && charRevealed[i] === 0 && !isGameOver) {
          let j = i;
          while (j < text.length && maskRegex.test(text[j]) && charRevealed[j] === 0 && !isGameOver) j++;
          html.push(`<span class="masked-block">${'█'.repeat(j - i)}</span>`);
          i = j - 1;
        } else {
          if (charRevealed[i] > 0 && maskRegex.test(text[i])) {
            const isLatest = (charRevealed[i] === latestTurn);
            let idStr = '';
            if (isLatest && !addedLatestId) {
              idStr = ' id="latest-hit"';
              addedLatestId = true;
            }
            html.push(`<span class="${isLatest ? 'revealed-latest' : 'revealed'}"${idStr}>${escapeHtml(text[i])}</span>`);
          } else {
            html.push(escapeHtml(text[i]));
          }
        }
      }
      document.getElementById('article-preview').innerHTML = html.join('');
      if (latestTurn > 0) scrollToLatest();
    }

    function scrollToLatest() {
      const el = document.getElementById('latest-hit');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // --- 7. 数値カウントアニメーション ---
    function animateValue(obj, start, end, duration) {
      let startTimestamp = null;
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        obj.innerHTML = Math.floor(progress * (end - start) + start) + '回';
        if (progress < 1) window.requestAnimationFrame(step);
      };
      window.requestAnimationFrame(step);
    }

    // --- 8. ゲーム終了処理 ---
    function giveUp() {
      if (isGameOver) return;
      if (!confirm('ギブアップして答えを見ますか？')) return;
      endGame(false);
    }

    function endGame(isClear) {
      isGameOver = true;
      document.getElementById('word-input').disabled = true;
      document.getElementById('submit-btn').disabled = true;
      document.getElementById('hint-btn').disabled = true;
      document.getElementById('giveup-btn').disabled = true;
      
      document.getElementById('article-heading').textContent = currentArticle.title;
      updateArticlePreview(0); // 全文解禁

      const ambox = document.getElementById('result-ambox');
      ambox.className = `ambox ${isClear ? 'ambox-success' : 'ambox-danger'}`;
      document.getElementById('result-icon').textContent = isClear ? '🎉' : '🏳️';
      document.getElementById('result-title').textContent = isClear ? '見事正解です！' : 'ギブアップしました。';
      
      // 結果にモードを明記
      document.getElementById('result-desc').innerHTML = `正解の記事は「<strong>${escapeHtml(currentArticle.title)}</strong>」でした。<br><span style="font-size:0.85rem; color:var(--text-muted); display:inline-block; margin-top:4px;">出題モード: ${escapeHtml(currentArticle.modeName)}</span>`;
      
      document.getElementById('result-link').href = currentArticle.url;
      ambox.style.display = 'flex';

      if (isClear) { playClear(); startConfetti(); } else { playGiveup(); }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // --- 9. SNSシェア機能 ---
    function shareResult() {
      const hitCount = attempts.filter(a => a.hit).length;
      const rate = Math.round((hitCount / attempts.length) * 100) || 0;
      
      let emj = '';
      for (let i = 0; i < Math.min(attempts.length, 6); i++) {
        emj += attempts[i].isCorrect ? '🟩' : (attempts[i].hit ? '🟨' : '⬛');
      }
      
      // シェアテキストにモードを明記
      const text = `📚 Wikipedia推測ゲーム\n🧩 モード: ${currentArticle.modeName}\n🎯 試行: ${attempts.length}回 (ヒット率: ${rate}%)\n💡 ヒント: ${hintsUsed}/${MAX_HINTS}\n${emj} ${attempts[0].isCorrect ? '🎉 正解！' : '🏳️ ギブアップ'}\n#WikiGuess`;
      
      navigator.clipboard.writeText(text).then(() => showToast('結果をクリップボードにコピーしました！'));
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.opacity = 1;
      setTimeout(() => toast.style.opacity = 0, 3000);
    }

    // --- 10. 紙吹雪パーティクル ---
    let particles = [], confettiFrame;
    function startConfetti() {
      const cvs = document.getElementById('confetti-canvas');
      const ctx = cvs.getContext('2d');
      cvs.width = window.innerWidth; cvs.height = window.innerHeight;
      cvs.style.display = 'block';
      const colors = ['#202122', '#0645ad', '#fc3', '#00af89', '#eaecf0'];
      
      for(let i=0; i<150; i++) {
        particles.push({
          x: Math.random() * cvs.width, y: Math.random() * cvs.height - cvs.height,
          r: Math.random() * 6 + 4, dx: Math.random() * 4 - 2, dy: Math.random() * 3 + 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          tilt: Math.random() * 10 - 10, tiltAngle: 0, tiltAngleInc: (Math.random() * 0.07) + 0.05
        });
      }
      function animate() {
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        let active = false;
        for(let p of particles) {
          p.tiltAngle += p.tiltAngleInc; p.y += p.dy; p.x += Math.sin(p.tiltAngle) * 2 + p.dx;
          if (p.y <= cvs.height) active = true;
          ctx.beginPath(); ctx.lineWidth = p.r; ctx.strokeStyle = p.color;
          ctx.moveTo(p.x + p.tilt + p.r, p.y); ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r); ctx.stroke();
        }
        if(active) confettiFrame = requestAnimationFrame(animate);
        else { cvs.style.display = 'none'; particles = []; }
      }
      animate();
    }
  </script>
</body>
