<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WikiGuesser - Wikipedia記事推測ゲーム</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --warning: #d97706;
      --warning-hover: #b45309;
      --warning-bg: #fffbeb;
      --warning-border: #fde68a;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      padding: 8px 0;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.025em;
    }

    header p {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    /* ローディング画面 */
    #loading-view {
      text-align: center;
      padding: 40px 20px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 入力フォーム */
    .input-form {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      font-size: 1rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button {
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-warning {
      background-color: var(--warning);
      color: #fff;
      font-size: 0.875rem;
    }

    .btn-warning:hover:not(:disabled) {
      background-color: var(--warning-hover);
    }

    .btn-outline {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .btn-outline:hover:not(:disabled) {
      background-color: #f1f5f9;
      color: var(--text);
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .action-group {
      display: flex;
      gap: 8px;
    }

    /* ヒントカード */
    #hints-card {
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .hints-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--warning-hover);
      margin-bottom: 10px;
    }

    .hints-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hint-item {
      font-size: 0.9rem;
      background: #ffffff;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--warning-border);
      line-height: 1.6;
      word-break: break-word;
      animation: fadeIn 0.3s ease;
    }

    .hint-item strong.hint-badge {
      display: inline-block;
      background: var(--warning);
      color: #fff;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      margin-right: 6px;
      vertical-align: middle;
    }

    .hint-highlight {
      color: var(--primary);
      font-weight: 700;
      font-size: 1.05rem;
    }

    /* 結果通知エリア */
    #status-card {
      display: none;
      text-align: center;
      animation: fadeIn 0.3s ease;
    }

    #status-card.win {
      border-color: var(--success);
      background-color: var(--success-bg);
      color: var(--text);
    }

    #status-card.lose {
      border-color: var(--danger);
      background-color: var(--danger-bg);
      color: var(--text);
    }

    #status-card h2 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    #status-card a {
      color: var(--primary);
      font-weight: bold;
      word-break: break-all;
    }

    .action-buttons {
      margin-top: 16px;
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    /* 質問履歴リスト */
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .history-header h3 {
      font-size: 1rem;
      font-weight: 700;
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 0.95rem;
      animation: fadeIn 0.2s ease;
    }

    .history-item.hit {
      background: #ecfdf5;
      border-color: #a7f3d0;
      color: #065f46;
      font-weight: 600;
    }

    .history-item.miss {
      color: #64748b;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .badge-hit {
      background-color: #10b981;
      color: #ffffff;
    }

    .badge-miss {
      background-color: #cbd5e1;
      color: #475569;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>WikiGuesser</h1>
    <p>隠されたWikipedia記事のタイトルを推測しよう！</p>
  </header>

  <!-- ローディング画面 -->
  <div id="loading-view" class="card">
    <div class="spinner"></div>
    <p id="loading-msg">良質な記事を読み込んでいます...</p>
  </div>

  <!-- ゲーム終了時のカード（正解 / ギブアップ） -->
  <div id="status-card" class="card">
    <h2 id="status-title"></h2>
    <p id="status-desc" style="margin-bottom: 8px;"></p>
    <p id="status-link-wrap">
      記事リンク: <a id="status-link" href="" target="_blank" rel="noopener noreferrer"></a>
    </p>
    <div class="action-buttons">
      <button class="btn-primary" onclick="initGame()">もう一度遊ぶ</button>
    </div>
  </div>

  <!-- メイン操作エリア -->
  <main id="game-view" class="card" style="display: none;">
    <form class="input-form" id="guess-form" onsubmit="handleGuess(event)">
      <input 
        type="text" 
        id="word-input" 
        placeholder="単語を入力（例: 日本、歴史、科学...）" 
        autocomplete="off"
        required
      >
      <button type="submit" class="btn-primary" id="submit-btn">質問する</button>
    </form>

    <div class="action-bar">
      <div style="font-size: 0.875rem; color: var(--text-muted);">
        試行回数: <strong id="guess-count">0</strong> 回
      </div>
      <div class="action-group">
        <button type="button" class="btn-warning" id="hint-btn" onclick="useHint()">
          💡 ヒントを使う（残り 3/3回）
        </button>
        <button type="button" class="btn-outline" onclick="giveUp()" id="giveup-btn">
          ギブアップ
        </button>
      </div>
    </div>
  </main>

  <!-- ヒントカード -->
  <section id="hints-card" class="card">
    <div class="hints-header">
      <span>💡 開示されたヒント</span>
    </div>
    <ul class="hints-list" id="hints-list"></ul>
  </section>

  <!-- 質問履歴 -->
  <section id="history-view" class="card" style="display: none;">
    <div class="history-header">
      <h3>質問の履歴</h3>
      <span id="hit-rate" style="font-size: 0.8rem; color: var(--text-muted);"></span>
    </div>
    <ul class="history-list" id="history-list"></ul>
  </section>
</div>

<script>
  const MAX_HINTS = 3;

  // ゲーム状態
  let currentArticle = {
    title: '',
    cleanTitle: '',
    extract: '',
    normalizedTitle: '',
    normalizedCleanTitle: '',
    normalizedExtract: '',
    url: ''
  };

  let attempts = [];
  let hintsUsed = 0;
  let openedHints = [];
  let isGameOver = false;

  // テキスト正規化（全角半角統一・小文字化）
  function normalizeText(str) {
    if (!str) return '';
    return str.normalize('NFKC').toLowerCase().trim();
  }

  // 正規表現エスケープ
  function escapeRegExp(string) {
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  // HTMLエスケープ
  function escapeHtml(str) {
    return str.replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
  }

  // 「良質な記事 / 秀逸な記事」カテゴリから1回のAPIコールで高速取得
  async function fetchQualityArticle() {
    const categories = ['Category:良質な記事', 'Category:秀逸な記事'];
    const charList = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわABCDEFGHIJKLMNOPQRSTUVWXYZ';

    while (true) {
      try {
        const category = categories[Math.floor(Math.random() * categories.length)];
        const randomChar = charList[Math.floor(Math.random() * charList.length)];

        // カテゴリから指定開始位置以降の記事を20件取得
        const endpoint = `https://ja.wikipedia.org/w/api.php?action=query&generator=categorymembers&gcmtitle=${encodeURIComponent(category)}&gcmnamespace=0&gcmlimit=20&gcmstartsortkeyprefix=${encodeURIComponent(randomChar)}&prop=extracts&explaintext=1&exintro=0&origin=*&format=json`;
        
        const res = await fetch(endpoint);
        const data = await res.json();

        if (data && data.query && data.query.pages) {
          const pages = Object.values(data.query.pages);
          // 取得したページをランダムにシャッフル
          pages.sort(() => Math.random() - 0.5);

          for (const page of pages) {
            const text = page.extract || '';
            const title = page.title || '';

            // 良質な記事・秀逸な記事なので十分な文字数があるものを採用
            if (text.length >= 800 && !title.includes('曖昧さ回避')) {
              const cleanTitle = title.replace(/\s*\(.*?\)$/, '');
              return {
                title: title,
                cleanTitle: cleanTitle,
                extract: text,
                normalizedTitle: normalizeText(title),
                normalizedCleanTitle: normalizeText(cleanTitle),
                normalizedExtract: normalizeText(text),
                url: `https://ja.wikipedia.org/wiki/${encodeURIComponent(title)}`
              };
            }
          }
        }
      } catch (err) {
        console.error('記事の取得に失敗しました。再試行します...', err);
      }
    }
  }

  // ゲーム初期化
  async function initGame() {
    isGameOver = false;
    attempts = [];
    hintsUsed = 0;
    openedHints = [];

    // UI初期化
    document.getElementById('loading-view').style.display = 'block';
    document.getElementById('game-view').style.display = 'none';
    document.getElementById('history-view').style.display = 'none';
    document.getElementById('hints-card').style.display = 'none';
    document.getElementById('status-card').style.display = 'none';
    document.getElementById('status-card').className = 'card';
    
    document.getElementById('history-list').innerHTML = '';
    document.getElementById('hints-list').innerHTML = '';
    document.getElementById('guess-count').textContent = '0';
    document.getElementById('hit-rate').textContent = '';
    document.getElementById('word-input').value = '';
    document.getElementById('word-input').disabled = false;
    document.getElementById('submit-btn').disabled = false;
    document.getElementById('giveup-btn').disabled = false;

    updateHintButtonUI();

    // 記事の取得（高速）
    currentArticle = await fetchQualityArticle();

    // 画面表示切り替え
    document.getElementById('loading-view').style.display = 'none';
    document.getElementById('game-view').style.display = 'block';
    document.getElementById('history-view').style.display = 'block';
    document.getElementById('word-input').focus();
  }

  // ヒントボタン表示の更新
  function updateHintButtonUI() {
    const hintBtn = document.getElementById('hint-btn');
    const remaining = MAX_HINTS - hintsUsed;
    hintBtn.textContent = `💡 ヒントを使う（残り ${remaining}/${MAX_HINTS}回）`;
    if (remaining <= 0 || isGameOver) {
      hintBtn.disabled = true;
    } else {
      hintBtn.disabled = false;
    }
  }

  // 伏字冒頭文の生成
  function generateMaskedSentence() {
    const firstLine = currentArticle.extract.trim().split(/\n+/)[0] || '';
    let sentence = firstLine.split('。')[0];
    sentence = sentence ? sentence + '。' : firstLine;

    let masked = sentence;
    const titleRegex = new RegExp(escapeRegExp(currentArticle.cleanTitle), 'gi');
    masked = masked.replace(titleRegex, '【■■■】');

    // 読み仮名や欧文併記などの括弧を伏字化
    masked = masked.replace(/（[^）]{1,80}）|\([^\\)]{1,80}\)/g, '（……）');

    return escapeHtml(masked).replace(/【■■■】/g, '<strong style="color:var(--primary);">【■■■】</strong>');
  }

  // ヒントを使う処理
  function useHint() {
    if (isGameOver || hintsUsed >= MAX_HINTS) return;

    hintsUsed++;
    let hintContent = '';

    if (hintsUsed === 1) {
      // 1回目: 文字数
      const charCount = currentArticle.cleanTitle.length;
      hintContent = `<strong class="hint-badge">第1ヒント</strong> タイトルは <span class="hint-highlight">${charCount}文字</span> です（※曖昧さ回避の括弧等を除く）`;
    } else if (hintsUsed === 2) {
      // 2回目: 冒頭の伏字定義文
      const masked = generateMaskedSentence();
      hintContent = `<strong class="hint-badge">第2ヒント</strong> <strong>冒頭の解説文:</strong><br>${masked}`;
    } else if (hintsUsed === 3) {
      // 3回目: 頭文字
      const firstChar = currentArticle.cleanTitle.charAt(0);
      hintContent = `<strong class="hint-badge">第3ヒント</strong> タイトルの最初の1文字は <span class="hint-highlight">『 ${escapeHtml(firstChar)} 』</span> です`;
    }

    openedHints.push(hintContent);
    renderHints();
    updateHintButtonUI();
  }

  // ヒント一覧の再描画
  function renderHints() {
    const hintsCard = document.getElementById('hints-card');
    const hintsList = document.getElementById('hints-list');

    if (openedHints.length > 0) {
      hintsCard.style.display = 'block';
      hintsList.innerHTML = openedHints.map(hint => `
        <li class="hint-item">${hint}</li>
      `).join('');
    } else {
      hintsCard.style.display = 'none';
      hintsList.innerHTML = '';
    }
  }

  // 推測・質問処理
  function handleGuess(e) {
    e.preventDefault();
    if (isGameOver) return;

    const inputElem = document.getElementById('word-input');
    const rawInput = inputElem.value.trim();
    const normalizedInput = normalizeText(rawInput);

    if (normalizedInput.length < 2) {
      alert('2文字以上で入力してください。');
      return;
    }

    if (attempts.some(a => a.normalized === normalizedInput)) {
      alert('その単語はすでに質問しています。');
      inputElem.value = '';
      return;
    }

    const isCorrect = (
      normalizedInput === currentArticle.normalizedTitle ||
      normalizedInput === currentArticle.normalizedCleanTitle
    );

    const regex = new RegExp(escapeRegExp(normalizedInput), 'g');
    const matches = currentArticle.normalizedExtract.match(regex);
    const count = matches ? matches.length : 0;

    const attempt = {
      word: rawInput,
      normalized: normalizedInput,
      count: count,
      hit: count > 0,
      isCorrect: isCorrect
    };

    attempts.unshift(attempt);
    updateHistoryUI();
    inputElem.value = '';

    if (isCorrect) {
      gameClear();
    } else {
      inputElem.focus();
    }
  }

  // 質問履歴UI更新
  function updateHistoryUI() {
    const listElem = document.getElementById('history-list');
    document.getElementById('guess-count').textContent = attempts.length;

    const hits = attempts.filter(a => a.hit).length;
    document.getElementById('hit-rate').textContent = `ヒット率: ${Math.round((hits / attempts.length) * 100) || 0}%`;

    listElem.innerHTML = attempts.map(item => `
      <li class="history-item ${item.hit ? 'hit' : 'miss'}">
        <span><strong>${escapeHtml(item.word)}</strong></span>
        <span class="badge ${item.hit ? 'badge-hit' : 'badge-miss'}">
          ${item.hit ? `はい（${item.count}回）` : 'いいえ（0回）'}
        </span>
      </li>
    `).join('');
  }

  // ゲームクリア
  function gameClear() {
    isGameOver = true;
    finishGameControls();

    const statusCard = document.getElementById('status-card');
    statusCard.className = 'card win';
    document.getElementById('status-title').textContent = '🎉 正解です！お見事！';
    document.getElementById('status-desc').textContent = `正解は「${currentArticle.title}」でした！（試行回数: ${attempts.length}回 / ヒント使用: ${hintsUsed}回）`;
    
    const link = document.getElementById('status-link');
    link.href = currentArticle.url;
    link.textContent = currentArticle.title;

    statusCard.style.display = 'block';
  }

  // ギブアップ
  function giveUp() {
    if (isGameOver) return;
    if (!confirm('本当にギブアップしますか？答えが表示されます。')) return;

    isGameOver = true;
    finishGameControls();

    const statusCard = document.getElementById('status-card');
    statusCard.className = 'card lose';
    document.getElementById('status-title').textContent = '🏳️ ギブアップ！';
    document.getElementById('status-desc').textContent = `正解は「${currentArticle.title}」でした。`;

    const link = document.getElementById('status-link');
    link.href = currentArticle.url;
    link.textContent = currentArticle.title;

    statusCard.style.display = 'block';
  }

  // コントロール無効化
  function finishGameControls() {
    document.getElementById('word-input').disabled = true;
    document.getElementById('submit-btn').disabled = true;
    document.getElementById('hint-btn').disabled = true;
    document.getElementById('giveup-btn').disabled = true;
  }

  // 初回起動
  window.addEventListener('DOMContentLoaded', initGame);
</script>
</body>
</html>
