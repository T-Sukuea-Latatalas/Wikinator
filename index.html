<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>推測ゲーム - ウィキペディア</title>
  <style>
    /* Wikipedia (Vectorスキン) カラーパレット & 基本設計 */
    :root {
      --wiki-bg: #f6f6f6;
      --content-bg: #ffffff;
      --text: #202122;
      --text-muted: #54595d;
      --border: #a2a9b1;
      --border-light: #eaecf0;
      --link: #0645ad;
      --link-visited: #0b0080;
      --link-red: #ba0000;
      --ooui-blue: #36c;
      --ooui-blue-hover: #447ff5;
      --ooui-blue-active: #2a4b8d;
      --ambox-yellow: #fc3;
      --ambox-green: #00af89;
      --ambox-red: #d33;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--wiki-bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Lato", "Helvetica", "Arial", sans-serif;
      font-size: 14px;
      line-height: 1.6;
      padding: 0 1.5em 2em;
    }

    /* 上部グローバルナビゲーション */
    #mw-header {
      max-width: 980px;
      margin: 0 auto;
      padding: 12px 0 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .wiki-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
    }

    .wiki-logo-icon {
      width: 32px;
      height: 32px;
      background: #000;
      color: #fff;
      font-family: 'Linux Libertine', 'Georgia', serif;
      font-size: 24px;
      font-weight: bold;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .wiki-logo-text {
      line-height: 1.1;
    }

    .wiki-logo-text strong {
      font-family: 'Linux Libertine', 'Georgia', serif;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      display: block;
    }

    .wiki-logo-text span {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Vector メインコンテナ */
    #content {
      max-width: 980px;
      margin: 0 auto;
      background: var(--content-bg);
      border: 1px solid var(--border);
      border-top: none;
      padding: 1.5em 2em 2.5em;
      position: relative;
    }

    /* Vector タブUI */
    #vector-tabs-wrapper {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      position: relative;
      bottom: -1px;
      z-index: 2;
    }

    .vector-tabs {
      display: flex;
      list-style: none;
      gap: 2px;
    }

    .vector-tabs li {
      background: #eaecf0;
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 2px 2px 0 0;
      padding: 6px 12px;
      font-size: 0.85rem;
      color: var(--link);
      cursor: default;
      user-select: none;
    }

    .vector-tabs li.selected {
      background: var(--content-bg);
      border-bottom: 1px solid var(--content-bg);
      color: var(--text);
      font-weight: bold;
    }

    /* 記事大見出し */
    .firstHeading {
      font-family: 'Linux Libertine', 'Georgia', 'Yu Mincho', 'Hiragino Mincho ProN', serif;
      font-size: 1.85rem;
      font-weight: normal;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
      margin-bottom: 4px;
      line-height: 1.25;
    }

    #siteSub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1.2em;
    }

    /* Wikipedia お知らせボックス（ambox風） */
    .ambox {
      border: 1px solid var(--border-light);
      border-left: 10px solid var(--border);
      background-color: #fcfcfc;
      padding: 10px 14px;
      margin-bottom: 1.2em;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      font-size: 0.9rem;
    }

    .ambox-notice { border-left-color: var(--ooui-blue); background-color: #f8f9fa; }
    .ambox-warning { border-left-color: var(--ambox-yellow); background-color: #fefcf5; }
    .ambox-success { border-left-color: var(--ambox-green); background-color: #f3fbf8; }
    .ambox-danger { border-left-color: var(--ambox-red); background-color: #fdf5f5; }

    .ambox-icon {
      font-size: 1.3rem;
      line-height: 1;
      padding-top: 2px;
    }

    .ambox-content {
      flex: 1;
    }

    .ambox-content strong.ambox-title {
      display: block;
      font-weight: bold;
      margin-bottom: 2px;
    }

    /* OOUI（MediaWiki UI）ボタンスタイル */
    .mw-ui-input {
      font-family: inherit;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.1s, box-shadow 0.1s;
      width: 100%;
      max-width: 380px;
    }

    .mw-ui-input:focus {
      border-color: var(--ooui-blue);
      box-shadow: inset 0 0 0 1px var(--ooui-blue);
    }

    .mw-ui-button {
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: bold;
      border-radius: 2px;
      padding: 7px 14px;
      cursor: pointer;
      border: 1px solid var(--border);
      background-color: #f8f9fa;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.1s, border-color 0.1s;
      vertical-align: middle;
      text-decoration: none;
    }

    .mw-ui-button:hover:not(:disabled) {
      background-color: #ffffff;
      border-color: #72777d;
    }

    .mw-ui-button.progressive {
      background-color: var(--ooui-blue);
      border-color: var(--ooui-blue);
      color: #fff;
    }

    .mw-ui-button.progressive:hover:not(:disabled) {
      background-color: var(--ooui-blue-hover);
      border-color: var(--ooui-blue-hover);
    }

    .mw-ui-button.destructive {
      color: var(--ambox-red);
    }

    .mw-ui-button.destructive:hover:not(:disabled) {
      background-color: #ffebee;
      border-color: var(--ambox-red);
    }

    .mw-ui-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ゲーム操作パネル */
    .game-panel {
      background: #f8f9fa;
      border: 1px solid var(--border-light);
      padding: 14px 16px;
      margin-bottom: 1.5em;
      border-radius: 2px;
    }

    .form-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-light);
      font-size: 0.85rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Wikipedia 目次（TOC）風 質問履歴 */
    .toc-box {
      border: 1px solid var(--border);
      background-color: #f8f9fa;
      padding: 10px 14px;
      margin-top: 1.5em;
      display: table;
      min-width: 320px;
      max-width: 100%;
      border-radius: 2px;
    }

    .toc-title {
      font-weight: bold;
      text-align: center;
      font-size: 0.9rem;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .toc-list {
      list-style: none;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .toc-item {
      padding: 4px 6px;
      font-size: 0.9rem;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .toc-item:last-child {
      border-bottom: none;
    }

    .toc-item .toc-word {
      color: var(--link);
      text-decoration: none;
      cursor: pointer;
    }

    .toc-item .toc-word:hover {
      text-decoration: underline;
    }

    .toc-item.miss .toc-word {
      color: var(--text-muted);
      text-decoration: none;
    }

    .toc-badge {
      font-size: 0.78rem;
      padding: 1px 6px;
      border-radius: 2px;
      font-weight: bold;
    }

    .badge-hit {
      background: #e6f6ee;
      color: #007a50;
      border: 1px solid #bce8d2;
    }

    .badge-miss {
      background: #f1f2f3;
      color: #72777d;
      border: 1px solid #dcdfe1;
    }

    /* ヒント一覧リスト */
    .hint-step-list {
      list-style: square;
      padding-left: 20px;
      margin-top: 6px;
    }

    .hint-step-list li {
      margin-bottom: 6px;
      line-height: 1.5;
    }

    .hint-highlight {
      font-weight: bold;
      color: var(--link);
    }

    /* ローディング表示 */
    #loading-view {
      text-align: center;
      padding: 40px 0;
      color: var(--text-muted);
    }

    .loading-spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid var(--border-light);
      border-top-color: var(--ooui-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    a.wiki-link {
      color: var(--link);
      text-decoration: none;
    }

    a.wiki-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- 上部ヘッダー（Wikipediaロゴ風） -->
  <header id="mw-header">
    <a href="#" onclick="location.reload()" class="wiki-logo">
      <div class="wiki-logo-icon">W</div>
      <div class="wiki-logo-text">
        <strong>WIKIPEDIA</strong>
        <span>フリー百科事典</span>
      </div>
    </a>
  </header>

  <!-- VectorタブUI（装飾＋ゲームステータス） -->
  <div id="vector-tabs-wrapper">
    <ul class="vector-tabs">
      <li class="selected">ページ</li>
      <li>ノート</li>
    </ul>
    <ul class="vector-tabs">
      <li class="selected">閲覧</li>
      <li>編集</li>
      <li>履歴表示</li>
    </ul>
  </div>

  <!-- メイン記事コンテンツ枠 -->
  <main id="content">
    <h1 class="firstHeading" id="article-heading">推測ゲーム: 隠された記事</h1>
    <div id="siteSub">出典: フリー百科事典『ウィキペディア（Wikipedia）』</div>

    <!-- ローディング表示 -->
    <div id="loading-view">
      <div class="loading-spinner"></div>
      <p>Wikipedia「良質な記事」から出題データを取得中...</p>
    </div>

    <!-- 正解 / ギブアップ表示 (ambox) -->
    <div id="status-ambox" class="ambox" style="display: none;">
      <div class="ambox-icon" id="status-icon">🎉</div>
      <div class="ambox-content">
        <strong class="ambox-title" id="status-title">正解です！</strong>
        <div id="status-desc"></div>
        <div style="margin-top: 8px;">
          記事本文を読む: <a id="status-article-link" class="wiki-link" href="" target="_blank" rel="noopener noreferrer"></a>
        </div>
        <div style="margin-top: 10px;">
          <button type="button" class="mw-ui-button progressive" onclick="initGame()">次の記事で遊ぶ</button>
        </div>
      </div>
    </div>

    <!-- ゲーム操作エリア -->
    <div id="game-container" style="display: none;">
      
      <!-- 記事解説テンプレート（ルール説明） -->
      <div class="ambox ambox-notice">
        <div class="ambox-icon">ℹ️</div>
        <div class="ambox-content">
          <strong>この記事のタイトルは何でしょう？</strong>
          <span>単語を入力して質問してください。その単語が記事本文に含まれる出現回数が表示されます。タイトルを的中させるとクリアです。</span>
        </div>
      </div>

      <!-- ヒントエリア（ambox-warning） -->
      <div id="hints-ambox" class="ambox ambox-warning" style="display: none;">
        <div class="ambox-icon">💡</div>
        <div class="ambox-content">
          <strong class="ambox-title">開示されたヒント</strong>
          <ul class="hint-step-list" id="hints-list"></ul>
        </div>
      </div>

      <!-- 入力フォーム -->
      <div class="game-panel">
        <form class="form-row" id="guess-form" onsubmit="handleGuess(event)">
          <input 
            type="text" 
            class="mw-ui-input" 
            id="word-input" 
            placeholder="単語を入力（例: 歴史、日本、科学、人物...）" 
            autocomplete="off" 
            required
          >
          <button type="submit" class="mw-ui-button progressive" id="submit-btn">質問を送信</button>
        </form>

        <div class="stats-row">
          <div>
            質問試行回数: <strong id="guess-count">0</strong> 回
            <span id="hit-rate" style="margin-left: 10px; color: var(--text-muted);"></span>
          </div>
          <div style="display: flex; gap: 6px;">
            <button type="button" class="mw-ui-button" id="hint-btn" onclick="useHint()">
              💡 ヒントを開示（残り 3/3回）
            </button>
            <button type="button" class="mw-ui-button destructive" id="giveup-btn" onclick="giveUp()">
              ギブアップ
            </button>
          </div>
        </div>
      </div>

      <!-- 質問履歴（目次 / TOCスタイル） -->
      <div class="toc-box" id="history-box" style="display: none;">
        <div class="toc-title">
          <span>質問履歴（索引）</span>
          <span style="font-size: 0.75rem; font-weight: normal; color: var(--text-muted);" id="toc-count">0件</span>
        </div>
        <ul class="toc-list" id="history-list"></ul>
      </div>

    </div>
  </main>

  <script>
    const MAX_HINTS = 3;

    // ゲーム状態
    let currentArticle = {
      title: '',
      cleanTitle: '',
      extract: '',
      normalizedTitle: '',
      normalizedCleanTitle: '',
      normalizedExtract: '',
      url: ''
    };

    let attempts = [];
    let hintsUsed = 0;
    let openedHints = [];
    let isGameOver = false;

    // テキスト正規化
    function normalizeText(str) {
      if (!str) return '';
      return str.normalize('NFKC').toLowerCase().trim();
    }

    // 正規表現エスケープ
    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // HTMLエスケープ
    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Wikipedia「良質な記事」「秀逸な記事」から高速取得
    async function fetchQualityArticle() {
      const categories = ['Category:良質な記事', 'Category:秀逸な記事'];
      const charList = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわABCDEFGHIJKLMNOPQRSTUVWXYZ';

      while (true) {
        try {
          const category = categories[Math.floor(Math.random() * categories.length)];
          const randomChar = charList[Math.floor(Math.random() * charList.length)];

          const endpoint = `https://ja.wikipedia.org/w/api.php?action=query&generator=categorymembers&gcmtitle=${encodeURIComponent(category)}&gcmnamespace=0&gcmlimit=20&gcmstartsortkeyprefix=${encodeURIComponent(randomChar)}&prop=extracts&explaintext=1&exintro=0&origin=*&format=json`;
          
          const res = await fetch(endpoint);
          const data = await res.json();

          if (data && data.query && data.query.pages) {
            const pages = Object.values(data.query.pages);
            pages.sort(() => Math.random() - 0.5);

            for (const page of pages) {
              const text = page.extract || '';
              const title = page.title || '';

              if (text.length >= 800 && !title.includes('曖昧さ回避')) {
                const cleanTitle = title.replace(/\s*\(.*?\)$/, '');
                return {
                  title: title,
                  cleanTitle: cleanTitle,
                  extract: text,
                  normalizedTitle: normalizeText(title),
                  normalizedCleanTitle: normalizeText(cleanTitle),
                  normalizedExtract: normalizeText(text),
                  url: `https://ja.wikipedia.org/wiki/${encodeURIComponent(title)}`
                };
              }
            }
          }
        } catch (err) {
          console.error('記事取得失敗。再試行します...', err);
        }
      }
    }

    // ゲーム初期化
    async function initGame() {
      isGameOver = false;
      attempts = [];
      hintsUsed = 0;
      openedHints = [];

      // UIリセット
      document.getElementById('loading-view').style.display = 'block';
      document.getElementById('game-container').style.display = 'none';
      document.getElementById('status-ambox').style.display = 'none';
      document.getElementById('hints-ambox').style.display = 'none';
      document.getElementById('history-box').style.display = 'none';
      document.getElementById('article-heading').textContent = '推測ゲーム: 隠された記事';
      
      document.getElementById('history-list').innerHTML = '';
      document.getElementById('hints-list').innerHTML = '';
      document.getElementById('guess-count').textContent = '0';
      document.getElementById('toc-count').textContent = '0件';
      document.getElementById('hit-rate').textContent = '';
      document.getElementById('word-input').value = '';
      document.getElementById('word-input').disabled = false;
      document.getElementById('submit-btn').disabled = false;
      document.getElementById('giveup-btn').disabled = false;

      updateHintButtonUI();

      // 記事取得
      currentArticle = await fetchQualityArticle();

      // 画面表示
      document.getElementById('loading-view').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';
      document.getElementById('word-input').focus();
    }

    // ヒントボタン表示の更新
    function updateHintButtonUI() {
      const hintBtn = document.getElementById('hint-btn');
      const remaining = MAX_HINTS - hintsUsed;
      hintBtn.textContent = `💡 ヒントを開示（残り ${remaining}/${MAX_HINTS}回）`;
      hintBtn.disabled = (remaining <= 0 || isGameOver);
    }

    // 伏字冒頭文の生成
    function generateMaskedSentence() {
      const firstLine = currentArticle.extract.trim().split(/\n+/)[0] || '';
      let sentence = firstLine.split('。')[0];
      sentence = sentence ? sentence + '。' : firstLine;

      let masked = sentence;
      const titleRegex = new RegExp(escapeRegExp(currentArticle.cleanTitle), 'gi');
      masked = masked.replace(titleRegex, '【■■■】');
      masked = masked.replace(/（[^）]{1,80}）|\([^\\)]{1,80}\)/g, '（……）');

      return escapeHtml(masked).replace(/【■■■】/g, '<strong style="color:var(--link);">【■■■】</strong>');
    }

    // ヒント開示
    function useHint() {
      if (isGameOver || hintsUsed >= MAX_HINTS) return;

      hintsUsed++;
      let hintContent = '';

      if (hintsUsed === 1) {
        const charCount = currentArticle.cleanTitle.length;
        hintContent = `<strong>第1ヒント（文字数）:</strong> この記事のタイトルは <span class="hint-highlight">${charCount}文字</span> です（※曖昧さ回避の括弧等を除く）。`;
      } else if (hintsUsed === 2) {
        const masked = generateMaskedSentence();
        hintContent = `<strong>第2ヒント（定義文）:</strong><br><blockquote style="margin:4px 0 0 10px; color:var(--text);">${masked}</blockquote>`;
      } else if (hintsUsed === 3) {
        const firstChar = currentArticle.cleanTitle.charAt(0);
        hintContent = `<strong>第3ヒント（頭文字）:</strong> タイトルの最初の文字は <span class="hint-highlight">『 ${escapeHtml(firstChar)} 』</span> です。`;
      }

      openedHints.push(hintContent);
      renderHints();
      updateHintButtonUI();
    }

    // ヒント一覧の再描画
    function renderHints() {
      const hintsAmbox = document.getElementById('hints-ambox');
      const hintsList = document.getElementById('hints-list');

      if (openedHints.length > 0) {
        hintsAmbox.style.display = 'flex';
        hintsList.innerHTML = openedHints.map(hint => `<li>${hint}</li>`).join('');
      } else {
        hintsAmbox.style.display = 'none';
      }
    }

    // 質問・推測の処理
    function handleGuess(e) {
      e.preventDefault();
      if (isGameOver) return;

      const inputElem = document.getElementById('word-input');
      const rawInput = inputElem.value.trim();
      const normalizedInput = normalizeText(rawInput);

      if (normalizedInput.length < 2) {
        alert('2文字以上で入力してください。');
        return;
      }

      if (attempts.some(a => a.normalized === normalizedInput)) {
        alert('その単語はすでに質問履歴に含まれています。');
        inputElem.value = '';
        return;
      }

      const isCorrect = (
        normalizedInput === currentArticle.normalizedTitle ||
        normalizedInput === currentArticle.normalizedCleanTitle
      );

      const regex = new RegExp(escapeRegExp(normalizedInput), 'g');
      const matches = currentArticle.normalizedExtract.match(regex);
      const count = matches ? matches.length : 0;

      attempts.unshift({
        word: rawInput,
        normalized: normalizedInput,
        count: count,
        hit: count > 0,
        isCorrect: isCorrect
      });

      updateHistoryUI();
      inputElem.value = '';

      if (isCorrect) {
        gameClear();
      } else {
        inputElem.focus();
      }
    }

    // 質問履歴UI更新
    function updateHistoryUI() {
      const historyBox = document.getElementById('history-box');
      const listElem = document.getElementById('history-list');
      
      if (attempts.length > 0) {
        historyBox.style.display = 'table';
      }

      document.getElementById('guess-count').textContent = attempts.length;
      document.getElementById('toc-count').textContent = `${attempts.length}件`;

      const hits = attempts.filter(a => a.hit).length;
      document.getElementById('hit-rate').textContent = `（ヒット率: ${Math.round((hits / attempts.length) * 100) || 0}%）`;

      listElem.innerHTML = attempts.map(item => `
        <li class="toc-item ${item.hit ? 'hit' : 'miss'}">
          <span class="toc-word">${escapeHtml(item.word)}</span>
          <span class="toc-badge ${item.hit ? 'badge-hit' : 'badge-miss'}">
            ${item.hit ? `${item.count}回出現` : '0回'}
          </span>
        </li>
      `).join('');
    }

    // ゲームクリア
    function gameClear() {
      isGameOver = true;
      finishGameControls();

      document.getElementById('article-heading').textContent = currentArticle.title;

      const ambox = document.getElementById('status-ambox');
      ambox.className = 'ambox ambox-success';
      document.getElementById('status-icon').textContent = '🎉';
      document.getElementById('status-title').textContent = '正解です！見事に記事を特定しました。';
      document.getElementById('status-desc').textContent = `正解の記事は「${currentArticle.title}」でした。（試行回数: ${attempts.length}回 / ヒント使用: ${hintsUsed}回）`;
      
      const link = document.getElementById('status-article-link');
      link.href = currentArticle.url;
      link.textContent = `${currentArticle.title} - ウィキペディア`;

      ambox.style.display = 'flex';
    }

    // ギブアップ
    function giveUp() {
      if (isGameOver) return;
      if (!confirm('本当にギブアップしますか？答えの記事が表示されます。')) return;

      isGameOver = true;
      finishGameControls();

      document.getElementById('article-heading').textContent = currentArticle.title;

      const ambox = document.getElementById('status-ambox');
      ambox.className = 'ambox ambox-danger';
      document.getElementById('status-icon').textContent = '🏳️';
      document.getElementById('status-title').textContent = 'ギブアップしました。';
      document.getElementById('status-desc').textContent = `正解の記事は「${currentArticle.title}」でした。`;

      const link = document.getElementById('status-article-link');
      link.href = currentArticle.url;
      link.textContent = `${currentArticle.title} - ウィキペディア`;

      ambox.style.display = 'flex';
    }

    // 操作UIのロック
    function finishGameControls() {
      document.getElementById('word-input').disabled = true;
      document.getElementById('submit-btn').disabled = true;
      document.getElementById('hint-btn').disabled = true;
      document.getElementById('giveup-btn').disabled = true;
    }

    // 初期化起動
    window.addEventListener('DOMContentLoaded', initGame);
  </script>
</body>
</html>
